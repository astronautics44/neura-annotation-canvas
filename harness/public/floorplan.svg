<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
  <rect width="2400" height="1800" fill="#f5f0e8"/>

  <!-- Outer walls -->
  <rect x="80" y="80" width="2240" height="1640" fill="none" stroke="#2a1f0e" stroke-width="18"/>

  <!-- Room divider walls -->
  <!-- Vertical center wall -->
  <line x1="1200" y1="80" x2="1200" y2="1000" stroke="#2a1f0e" stroke-width="14"/>
  <!-- Horizontal mid wall -->
  <line x1="80" y1="900" x2="1200" y2="900" stroke="#2a1f0e" stroke-width="14"/>
  <line x1="1200" y1="700" x2="2320" y2="700" stroke="#2a1f0e" stroke-width="14"/>
  <!-- Right side vertical -->
  <line x1="1800" y1="700" x2="1800" y2="1720" stroke="#2a1f0e" stroke-width="14"/>
  <!-- Bottom horizontal -->
  <line x1="80" y1="1300" x2="1800" y2="1300" stroke="#2a1f0e" stroke-width="14"/>

  <!-- Door openings (gaps in walls) -->
  <!-- Room 1 door -->
  <line x1="600" y1="896" x2="740" y2="896" stroke="#f5f0e8" stroke-width="18"/>
  <path d="M600 896 Q600 816 680 816" fill="none" stroke="#2a1f0e" stroke-width="5" stroke-dasharray="6,4"/>
  <!-- Room 2 door -->
  <line x1="1280" y1="80" x2="1420" y2="80" stroke="#f5f0e8" stroke-width="18"/>
  <!-- Room 3 door -->
  <line x1="1796" y1="900" x2="1796" y2="1040" stroke="#f5f0e8" stroke-width="18"/>
  <path d="M1800 900 Q1880 900 1880 980" fill="none" stroke="#2a1f0e" stroke-width="5" stroke-dasharray="6,4"/>
  <!-- Hallway door -->
  <line x1="1196" y1="1050" x2="1196" y2="1200" stroke="#f5f0e8" stroke-width="18"/>

  <!-- Windows (thick marks on outer wall) -->
  <!-- Top wall windows -->
  <line x1="300" y1="80" x2="500" y2="80" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="310" y1="72" x2="310" y2="92" stroke="#6bb8d4" stroke-width="4"/>
  <line x1="490" y1="72" x2="490" y2="92" stroke="#6bb8d4" stroke-width="4"/>

  <line x1="850" y1="80" x2="1050" y2="80" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="860" y1="72" x2="860" y2="92" stroke="#6bb8d4" stroke-width="4"/>
  <line x1="1040" y1="72" x2="1040" y2="92" stroke="#6bb8d4" stroke-width="4"/>

  <line x1="1400" y1="80" x2="1650" y2="80" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="1950" y1="80" x2="2200" y2="80" stroke="#6bb8d4" stroke-width="12"/>

  <!-- Left wall windows -->
  <line x1="80" y1="250" x2="80" y2="450" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="80" y1="600" x2="80" y2="800" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="80" y1="1050" x2="80" y2="1250" stroke="#6bb8d4" stroke-width="12"/>

  <!-- Right wall windows -->
  <line x1="2320" y1="200" x2="2320" y2="500" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="2320" y1="900" x2="2320" y2="1200" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="2320" y1="1350" x2="2320" y2="1600" stroke="#6bb8d4" stroke-width="12"/>

  <!-- Bottom wall windows -->
  <line x1="300" y1="1720" x2="600" y2="1720" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="1000" y1="1720" x2="1300" y2="1720" stroke="#6bb8d4" stroke-width="12"/>
  <line x1="2000" y1="1720" x2="2200" y2="1720" stroke="#6bb8d4" stroke-width="12"/>

  <!-- Room labels -->
  <text x="580" y="460" text-anchor="middle" font-family="Arial" font-size="48" fill="#6b5a3e" font-weight="bold">LIVING ROOM</text>
  <text x="580" y="510" text-anchor="middle" font-family="Arial" font-size="28" fill="#9a8a72">42.5 m²</text>

  <text x="580" y="1080" text-anchor="middle" font-family="Arial" font-size="48" fill="#6b5a3e" font-weight="bold">KITCHEN</text>
  <text x="580" y="1130" text-anchor="middle" font-family="Arial" font-size="28" fill="#9a8a72">18.2 m²</text>

  <text x="580" y="1530" text-anchor="middle" font-family="Arial" font-size="48" fill="#6b5a3e" font-weight="bold">BATHROOM</text>
  <text x="580" y="1580" text-anchor="middle" font-family="Arial" font-size="28" fill="#9a8a72">8.4 m²</text>

  <text x="1700" y="350" text-anchor="middle" font-family="Arial" font-size="48" fill="#6b5a3e" font-weight="bold">MASTER BEDROOM</text>
  <text x="1700" y="400" text-anchor="middle" font-family="Arial" font-size="28" fill="#9a8a72">28.6 m²</text>

  <text x="1500" y="1000" text-anchor="middle" font-family="Arial" font-size="40" fill="#6b5a3e" font-weight="bold">BEDROOM 2</text>
  <text x="1500" y="1050" text-anchor="middle" font-family="Arial" font-size="28" fill="#9a8a72">16.8 m²</text>

  <text x="2060" y="1100" text-anchor="middle" font-family="Arial" font-size="40" fill="#6b5a3e" font-weight="bold">BEDROOM 3</text>
  <text x="2060" y="1150" text-anchor="middle" font-family="Arial" font-size="28" fill="#9a8a72">14.2 m²</text>

  <!-- Furniture outlines (faint) -->
  <!-- Sofa -->
  <rect x="200" y="200" width="380" height="140" rx="12" fill="none" stroke="#b8a898" stroke-width="5"/>
  <rect x="200" y="200" width="60" height="140" rx="8" fill="none" stroke="#b8a898" stroke-width="4"/>
  <rect x="520" y="200" width="60" height="140" rx="8" fill="none" stroke="#b8a898" stroke-width="4"/>
  <!-- Coffee table -->
  <rect x="280" y="380" width="200" height="100" rx="6" fill="none" stroke="#b8a898" stroke-width="4"/>
  <!-- Dining table -->
  <rect x="800" y="300" width="280" height="160" rx="6" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="840" cy="280" r="22" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="940" cy="280" r="22" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="1040" cy="280" r="22" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="840" cy="482" r="22" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="940" cy="482" r="22" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="1040" cy="482" r="22" fill="none" stroke="#b8a898" stroke-width="4"/>
  <!-- Bed master -->
  <rect x="1340" y="160" width="300" height="420" rx="10" fill="none" stroke="#b8a898" stroke-width="5"/>
  <rect x="1340" y="160" width="300" height="60" rx="6" fill="none" stroke="#b8a898" stroke-width="4"/>
  <!-- Bed 2 -->
  <rect x="1280" y="780" width="220" height="320" rx="10" fill="none" stroke="#b8a898" stroke-width="5"/>
  <rect x="1280" y="780" width="220" height="50" rx="6" fill="none" stroke="#b8a898" stroke-width="4"/>
  <!-- Kitchen counter -->
  <rect x="120" y="940" width="500" height="80" rx="4" fill="none" stroke="#b8a898" stroke-width="5"/>
  <rect x="120" y="940" width="80" height="80" rx="4" fill="none" stroke="#b8a898" stroke-width="3"/>
  <circle cx="250" cy="980" r="20" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="310" cy="980" r="20" fill="none" stroke="#b8a898" stroke-width="4"/>
  <circle cx="370" cy="980" r="20" fill="none" stroke="#b8a898" stroke-width="4"/>

  <!-- Stairs indication -->
  <rect x="1220" y="1320" width="220" height="380" fill="none" stroke="#2a1f0e" stroke-width="6"/>
  <line x1="1220" y1="1360" x2="1440" y2="1360" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1400" x2="1440" y2="1400" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1440" x2="1440" y2="1440" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1480" x2="1440" y2="1480" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1520" x2="1440" y2="1520" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1560" x2="1440" y2="1560" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1600" x2="1440" y2="1600" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1640" x2="1440" y2="1640" stroke="#2a1f0e" stroke-width="3"/>
  <line x1="1220" y1="1680" x2="1440" y2="1680" stroke="#2a1f0e" stroke-width="3"/>
  <text x="1330" y="1730" text-anchor="middle" font-family="Arial" font-size="24" fill="#6b5a3e">STAIRS</text>

  <!-- North arrow -->
  <g transform="translate(2220,160)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2a1f0e" stroke-width="4"/>
    <polygon points="0,-42 -12,10 0,0 12,10" fill="#2a1f0e"/>
    <polygon points="0,-42 -12,10 0,0 12,10" fill="#f5f0e8" transform="rotate(180)"/>
    <text x="0" y="70" text-anchor="middle" font-family="Arial" font-size="28" fill="#2a1f0e" font-weight="bold">N</text>
  </g>

  <!-- Scale bar -->
  <line x1="2000" y1="1760" x2="2300" y2="1760" stroke="#2a1f0e" stroke-width="4"/>
  <line x1="2000" y1="1748" x2="2000" y2="1772" stroke="#2a1f0e" stroke-width="4"/>
  <line x1="2300" y1="1748" x2="2300" y2="1772" stroke="#2a1f0e" stroke-width="4"/>
  <line x1="2150" y1="1748" x2="2150" y2="1772" stroke="#2a1f0e" stroke-width="3"/>
  <text x="2150" y="1795" text-anchor="middle" font-family="Arial" font-size="22" fill="#2a1f0e">5m</text>
  <text x="2000" y="1795" text-anchor="middle" font-family="Arial" font-size="22" fill="#2a1f0e">0</text>
  <text x="2300" y="1795" text-anchor="middle" font-family="Arial" font-size="22" fill="#2a1f0e">10m</text>
</svg>
